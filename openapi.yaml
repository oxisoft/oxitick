components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A session token from `/auth/login` or `/auth/refresh`. Short-lived and
        refreshable; this is what the apps use for everything.
    AppTokenAuth:
      type: http
      scheme: bearer
      description: |
        An app token: `oxt_` followed by 43 characters, created in the app under
        Settings → Security and shown exactly once.

        Deliberately weaker than a session. It is accepted **only** on
        `/api/v1/personal/*` — never on `/auth`, `/devices`, `/sync`, `/shared`,
        `/tokens` or the admin console — so a leaked token cannot change a
        password, disable two-factor, wipe a device, or mint a successor that
        survives revoking the original.

        Carries one of three cumulative scopes: `read`, `write` (implies read),
        `delete` (implies both). Revocation takes effect on the next request.

        Send it in the `Authorization` header and nowhere else. A credential in
        a query string is written to this server's access log and to every proxy
        in front of it.

  parameters:
    Limit:
      name: limit
      in: query
      description: Page size. Default 50, hard maximum 200 — there is no "return everything" mode.
      schema:
        type: integer
        default: 50
        maximum: 200
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        default: 0
    ItemId:
      name: itemId
      in: path
      required: true
      schema:
        type: string
    SubitemId:
      name: subitemId
      in: path
      required: true
      schema:
        type: string
    TaskCompleted:
      name: completed
      in: query
      schema:
        type: boolean
    TaskDueBefore:
      name: due_before
      in: query
      description: RFC3339 UTC to the second
      schema:
        type: string
    TaskDueAfter:
      name: due_after
      in: query
      schema:
        type: string
    TaskOverdue:
      name: overdue
      in: query
      description: Only tasks past their due date and not yet completed
      schema:
        type: boolean
    TaskImportanceMin:
      name: importance_min
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 4

  responses:
    Unauthorized:
      description: Missing, malformed, expired or revoked credential
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: |
        Not found. Deliberately the same answer for something that does not
        exist, something belonging to another account, something soft-deleted,
        and a list closed to the API — telling them apart confirms the thing
        exists.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BadRequest:
      description: The request body or parameters were not usable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ScopeInsufficient:
      description: |
        The token is valid but was created without enough scope. The fix is a new
        token rather than signing in again, which is why this is 403 and not 401.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: This app token is read-only. Create a token with write access to do this.
            code: scope_insufficient
    AppAPIDisabled:
      description: |
        App tokens are switched off for this whole installation by its
        administrator. Nothing is wrong with the credential and creating a new
        one will not help — which is why this is 503 rather than 401 or 403. The
        token is not revoked and resumes when the feature is switched back on.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error: App tokens are turned off on this server. Ask whoever administers it.
            code: app_api_disabled
    RateLimited:
      description: |
        This token has spent its budget. `Retry-After` says how many seconds to
        wait.

        Budgets are per token: roughly 600 reads and 60 writes a minute, with a
        small burst. Limits are in-process, so they reset when the server
        restarts and are not shared between replicas.
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TaskPage:
      description: A page of tasks
      content:
        application/json:
          schema:
            type: object
            properties:
              items:
                type: array
                items:
                  $ref: '#/components/schemas/PersonalTask'
              total:
                type: integer
                description: Matches in total, so a caller can tell a page from the whole set
              limit:
                type: integer
              offset:
                type: integer

  schemas:
    AppToken:
      type: object
      description: A stored app token, without its secret — which is unrecoverable.
      properties:
        id:
          type: string
          description: |
            Also the device id this token's writes are attributed to. There is no
            row for it in `devices`: the identity is real for attribution and
            last-write-wins, and belongs to no hardware.
        name:
          type: string
        prefix:
          type: string
          description: The first characters of the secret, so a list can tell tokens apart
          example: oxt_7Kd2Qa
        scope:
          type: string
          enum: [read, write, delete]
        created_at:
          type: string
        expires_at:
          type: string
          description: Absent when the token does not expire, which is the default
        last_used_at:
          type: string
          description: Absent when nothing has used it yet — usually a config pasted wrong
        last_used_ip:
          type: string
          description: |
            The address the request came from. Only taken from `X-Forwarded-For`
            when the deployment sets `TRUSTED_PROXY`, because otherwise that
            header is written by the client.
        revoked_at:
          type: string
          description: Present once revoked. Revoked tokens stay listed.

    PersonalList:
      type: object
      description: |
        One of your own lists. Read-only over this API — there is no endpoint
        that creates, renames, archives or deletes one.
      properties:
        id:
          type: string
        title:
          type: string
        color:
          type: string
        icon:
          type: string
        default_note_type:
          type: string
          enum: [todo, note]
        is_archived:
          type: boolean
        open_tasks:
          type: integer
        total_tasks:
          type: integer
        created_at:
          type: string
        updated_at:
          type: string

    PersonalTask:
      type: object
      properties:
        id:
          type: string
        list_id:
          type: string
        title:
          type: string
        content:
          type: string
          description: |
            Truncated in list and search responses; whole only from
            `GET /personal/items/{itemId}`.
        content_truncated:
          type: boolean
          description: Present and true when `content` is a preview
        note_type:
          type: string
          enum: [todo, note]
        importance:
          type: integer
          minimum: 0
          maximum: 4
          description: |
            Normalised on read. SQLite could not add this constraint to databases
            that were upgraded rather than created, so stored values are clamped
            rather than trusted.
        is_completed:
          type: boolean
        completed_at:
          type: string
        due_at:
          type: string
        is_pinned:
          type: boolean
        attachment_count:
          type: integer
          description: |
            A count and nothing else. File access is out of scope for app tokens,
            and a filename is content.
        created_at:
          type: string
        updated_at:
          type: string
        subitems:
          type: array
          description: Only populated when fetching a single task by id
          items:
            $ref: '#/components/schemas/PersonalSubtask'

    PersonalSubtask:
      type: object
      properties:
        id:
          type: string
        item_id:
          type: string
        title:
          type: string
        is_completed:
          type: boolean
        completed_at:
          type: string
        created_at:
          type: string
        updated_at:
          type: string

    # Authentication schemas
    LoginRequest:
      type: object
      required:
        - identifier
        - password
        - device_name
        - device_type
      properties:
        identifier:
          type: string
          description: Username or email address
          example: "johndoe"
        password:
          type: string
          example: "securepassword123"
        device_name:
          type: string
          example: "John's iPhone"
        device_type:
          type: string
          enum: [mobile, tablet, desktop, web, server]
          example: "mobile"
        totp_code:
          type: string
          description: TOTP code for 2FA (if enabled)
          pattern: '^[0-9]{6}$'
          example: "123456"

    LoginResponse:
      type: object
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
          description: Access token expiry in seconds
          example: 86400
        user_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string

    RefreshResponse:
      type: object
      properties:
        access_token:
          type: string
        expires_in:
          type: integer
          description: Access token expiry in seconds
          example: 86400

    SearchUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/UserSearchResult'

    UserSearchResult:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
          format: email

    # Device schemas
    GetDevicesResponse:
      type: object
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/Device'

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        device_name:
          type: string
        device_type:
          type: string
          enum: [mobile, tablet, desktop, web, server]
        public_key:
          type: string
          nullable: true
        key_enabled:
          type: boolean
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_user_id:
          type: string
          format: uuid
        created_by_device_id:
          type: string
          format: uuid
        updated_by_user_id:
          type: string
          format: uuid
        updated_by_device_id:
          type: string
          format: uuid
        is_active:
          type: boolean
        is_deleted:
          type: boolean
        deleted_at:
          type: string
          format: date-time
          nullable: true
        deleted_by_user_id:
          type: string
          format: uuid
          nullable: true
        deleted_by_device_id:
          type: string
          format: uuid
          nullable: true

    RegisterDeviceRequest:
      type: object
      required:
        - device_name
        - device_type
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          example: "Work Laptop"
        device_type:
          type: string
          enum: [mobile, tablet, desktop, web, server]
          example: "desktop"
        public_key:
          type: string
          description: Optional public key for device encryption

    RegisterDeviceResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        device_type:
          type: string

    UpdateDeviceRequest:
      type: object
      required:
        - device_name
        - device_type
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 100
        device_type:
          type: string
          enum: [mobile, tablet, desktop, web, server]
        public_key:
          type: string
          description: Optional public key for device encryption

    UpdateDeviceResponse:
      type: object
      properties:
        device_id:
          type: string
          format: uuid
        device_name:
          type: string
        device_type:
          type: string

    # Sync schemas
    SyncResponse:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Dynamic record based on table type
        server_time:
          type: string
          format: date-time
        has_more:
          type: boolean
          description: Whether there are more records to fetch
        next_cursor:
          type: string
          description: Cursor for pagination (if has_more is true)

    ApplyRequest:
      type: object
      required:
        - records
        - device_id
        - last_sync
      properties:
        records:
          type: array
          items:
            type: object
            additionalProperties: true
            description: Records to apply (format depends on table type)
        device_id:
          type: string
          format: uuid
          description: Device ID making the changes
        last_sync:
          type: string
          format: date-time
          description: Last sync timestamp for conflict resolution

    ApplyResponse:
      type: object
      properties:
        applied:
          type: integer
          description: Number of records successfully applied
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
          description: List of conflicts that occurred during apply
        server_time:
          type: string
          format: date-time

    Conflict:
      type: object
      properties:
        record_id:
          type: string
          description: ID of the conflicted record
        local_record:
          type: object
          additionalProperties: true
          description: The local record that was sent
        server_record:
          type: object
          additionalProperties: true
          description: The current server record
        resolution:
          type: string
          enum: [client_wins, server_wins, access_denied, error]
          description: How the conflict was resolved

    # Invitation schemas
    PendingInvitationsResponse:
      type: object
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/PendingInvitation'

    PendingInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        list_id:
          type: string
          format: uuid
        list_title:
          type: string
        permission:
          type: string
          enum: [read, write, admin]
        granted_by:
          type: string
          format: uuid
          description: User ID who sent the invitation
        granted_by_name:
          type: string
          description: Username of who sent the invitation
        granted_at:
          type: string
          format: date-time

    SentInvitationsResponse:
      type: object
      properties:
        invitations:
          type: array
          items:
            $ref: '#/components/schemas/SentInvitation'

    SentInvitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        list_id:
          type: string
          format: uuid
        list_title:
          type: string
        invitee_email:
          type: string
          format: email
        permission:
          type: string
          enum: [read, write, admin]
        invitation_status:
          type: string
          enum: [pending, accepted, declined]
        granted_at:
          type: string
          format: date-time

    InviteRequest:
      type: object
      required:
        - invitee_email
        - permission
      properties:
        invitee_email:
          type: string
          format: email
          description: Email address of the user to invite
        permission:
          type: string
          enum: [read, write, admin]
          description: Permission level to grant

    InviteResponse:
      type: object
      properties:
        invitation_id:
          type: string
          format: uuid
        message:
          type: string
          example: "Invitation sent successfully"

    # Common schemas
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Error message
        code:
          type: string
          description: Error code (optional)
        details:
          type: object
          additionalProperties: true
          description: Additional error details (optional)

    File:
      type: object
      description: An attachment's metadata. The bytes live behind /files/{id}/download.
      properties:
        id:
          type: string
          format: uuid
          description: Also the filename the bytes are stored under
        original_filename:
          type: string
          description: The name the file had when it was picked
        file_size:
          type: integer
          format: int64
        file_hash:
          type: string
          description: SHA-256 of the contents
        mime_type:
          type: string
          description: The catalogue's canonical type, decided from extension and content
          example: application/pdf
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_user_id:
          type: string
        created_by_device_id:
          type: string
        updated_by_user_id:
          type: string
        updated_by_device_id:
          type: string
        is_deleted:
          type: boolean

    # Data model schemas for sync operations
    ListRecord:
      type: object
      description: List record for sync operations
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          default: "#000000"
        icon:
          type: string
          nullable: true
        sort_order:
          type: integer
          default: 0
        owner_user_id:
          type: string
          format: uuid
        is_shared:
          type: boolean
          default: false
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        created_by_user_id:
          type: string
          format: uuid
        created_by_device_id:
          type: string
          format: uuid
        updated_by_user_id:
          type: string
          format: uuid
        updated_by_device_id:
          type: string
          format: uuid
        is_deleted:
